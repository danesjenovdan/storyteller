{% load static i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
<!DOCTYPE html>
<html lang="{{ CURRENT_LANGUAGE|default:'sl' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% trans "Storyteller" %}{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=Momo+Trust+Display&display=swap" rel="stylesheet">

    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="border-bottom bg-dark text-light">
        <nav class="container py-3 d-flex justify-content-between align-items-center">
            <a href="{% url 'video_list' %}" class="nav-link-home">{% trans "Storyteller" %}</a>
            <form action="{% url 'set_language' %}" method="post" class="lang-switch d-flex align-items-center gap-2">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.path }}">
                <label for="language-select" class="form-label mb-0">{% trans "Jezik" %}</label>
                <select id="language-select" name="language" class="form-select form-select-sm" onchange="this.form.submit()">
                    <option value="sl" {% if CURRENT_LANGUAGE|slice:":2" == 'sl' %}selected{% endif %}>Slovenščina</option>
                    <option value="en" {% if CURRENT_LANGUAGE|slice:":2" == 'en' %}selected{% endif %}>English</option>
                </select>
            </form>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
