[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyteller"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.2",
    "langchain==1.4.7",
    "django-huey==1.3.1",
    "django-redis==7.0.0",
    "tuspy==1.1.0",
    "google-genai==2.33.0",
    "langchain-google-genai==4.4.2",
    "psycopg2-binary==2.9.13",
    "boto3==1.43.120",
    "django-storages==1.14.6",
    "gunicorn==26.2.0",
    "requests==2.34.2",
    "elevenlabs==2.75.0",
    "openai==3.40.0",
    "Pillow==13.0.0",
]

[dependency-groups]
dev = [
    "black==25.1.0",
    "django-stubs==5.2.2",
    "django-stubs-ext==5.2.2",
    "ipython==9.17.1",
    "isort",
]

[tool.setuptools.packages.find]
include = ["agent*", "storyteller*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
