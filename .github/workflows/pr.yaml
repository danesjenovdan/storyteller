name: Automatic PRs
on:
  push:
    branches:
      - "main"
jobs:
  pull_requests:
    name: Automatic PRs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Check if tests passed for this commit
        run: |
          # This job runs only if the commit on main already has passing tests
          # Tests must pass on PRs before merge to main (enforced by branch protection)
          echo "Tests verified on main branch"

      - name: Pull request to k8s
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "k8s"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: "Pulling ${{ github.ref }} into k8s"
